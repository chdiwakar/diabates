name: Lab 13 - Diabetes MLOps Monitoring
on:
  workflow_dispatch:
  push:
    paths:
      - "src/mlops_pipeline/**"
      - "api/**"
      - ".github/workflows/lab13_monitoring.yml"
jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python src/mlops_pipeline/12_create_evolved_dataset.py
      - run: python src/mlops_pipeline/12_data_drift.py
      - run: python src/mlops_pipeline/12_prediction_drift.py
      - run: python src/mlops_pipeline/12_concept_drift.py
