name: Lab 13 - Diabetes Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "src/mlops_pipeline/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-api.txt pytest
      - run: pytest -q
